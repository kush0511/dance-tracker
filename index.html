<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <title>Dance Tracker</title>
    <meta
      name="description"
      content="A mobile-first dance practice tracker powered by a Google Sheet, with inline video playback."
    >
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="stage">
      <header class="hero" aria-label="Dance Tracker">
        <div class="hero-copy">
          <p class="kicker">Sheet-synced practice deck</p>
          <h1>Dance Tracker</h1>
          <p class="subtitle">A chrome-black queue for songs, routines, and in-place rehearsal clips.</p>
        </div>

        <a
          class="edit-button"
          href="https://docs.google.com/spreadsheets/d/1GNIUlLSlFTDkhrSnxI1LlMSjP72bmB3ggdLRjviJpFc/edit?usp=sharing"
          target="_blank"
          rel="noopener"
          aria-label="Edit the Google Sheet"
        >
          <i data-lucide="pencil" aria-hidden="true"></i>
          <span>Edit</span>
        </a>

        <div class="helmet-mark" aria-hidden="true">
          <span class="visor"></span>
        </div>
      </header>

      <main class="deck">
        <section class="controls" aria-label="Dance list controls">
          <label class="search-field" for="dance-search">
            <i data-lucide="search" aria-hidden="true"></i>
            <input
              id="dance-search"
              type="search"
              autocomplete="off"
              placeholder="Search the set"
            >
          </label>
          <div class="counter" id="list-stats" aria-live="polite">Loading</div>
        </section>

        <section class="track-panel" aria-label="Dance entries">
          <div class="panel-top">
            <span>Track</span>
            <span>Routine</span>
            <span>Clip</span>
          </div>
          <div id="status" class="status">Loading the set...</div>
          <div id="dance-list" class="track-list" hidden></div>
        </section>
      </main>
    </div>
  </body>
</html>
